name: 每日家务任务推送

on:
  schedule:
    - cron: "7 20 * * *"   # 北京时间 4:07（UTC 20:07，注意UTC日期是前一天，这是正常的）
  workflow_dispatch:

jobs:
  daily-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: 执行每日推送
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python daily_chore.py
